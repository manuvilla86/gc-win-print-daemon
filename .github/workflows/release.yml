name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"

      - name: Install tools
        run: sudo apt-get install -y nsis mingw-w64-tools

      - name: Download dependencies
        run: GOOS=windows go mod tidy

      - name: Compile Windows resources
        run: x86_64-w64-mingw32-windres -i resources.rc -O coff -o resources_windows.syso

      - name: Build exe
        run: GOOS=windows GOARCH=amd64 go build -ldflags="-H windowsgui -s -w" -o printbridge.exe .

      - name: Build installer
        run: makensis -DAPP_VERSION=${GITHUB_REF_NAME#v} installer.nsi

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: PrintBridge-Setup.exe
          generate_release_notes: true
